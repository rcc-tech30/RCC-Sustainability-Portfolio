<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Archived project notice for the RCC Sustainability Portfolio.">
  <title>Project archived | RCC Sustainability Portfolio</title>
  <link rel="icon" type="image/png" href="../../assets/rcc-favicon.png">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #102a26;
      background: #f2f6f3;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 18%, rgba(126, 215, 180, 0.22), transparent 28%),
        #f2f6f3;
    }
    main {
      width: min(620px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid #d5ded8;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 52px rgba(7, 42, 36, 0.10);
    }
    p:first-child {
      margin: 0 0 14px;
      color: #278963;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #072a24;
      font-size: clamp(36px, 8vw, 56px);
      letter-spacing: -0.045em;
      line-height: 1;
    }
    main > p:not(:first-child) {
      margin: 22px 0 30px;
      color: #607069;
      font-size: 17px;
      line-height: 1.65;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 50px;
      padding: 0 20px;
      border-radius: 10px;
      color: #ffffff;
      background: #0b3b31;
      font-weight: 750;
      text-decoration: none;
    }
    a:hover { background: #072a24; }
    a:focus-visible { outline: 3px solid #278963; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <p>RCC Sustainability Portfolio</p>
    <h1>Project archived</h1>
    <p>This project has been archived. View the current sustainability portfolio projects by Reiniel Celgie Chan.</p>
    <a href="../../#portfolio">View current portfolio projects</a>
  </main>
</body>
</html>
