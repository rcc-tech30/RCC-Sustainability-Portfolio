<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Company X by RCC illustrative GHG dashboard portfolio sample">
  <title>Company X by RCC | GHG Dashboard</title>
  <style>
    :root {
      --forest-950: #082f28;
      --forest-900: #0b3b31;
      --forest-800: #115044;
      --forest-700: #176b55;
      --emerald-600: #1a8f65;
      --emerald-500: #24a877;
      --emerald-300: #7ed7b4;
      --mint-200: #cceede;
      --mint-100: #e8f7ef;
      --mint-50: #f4fbf7;
      --ink-950: #17211e;
      --ink-700: #41504b;
      --ink-500: #68756f;
      --line: #dce5e0;
      --paper: #ffffff;
      --canvas: #f1f5f2;
      --amber: #d89528;
      --amber-soft: #fff4d9;
      --red: #c65656;
      --red-soft: #fdeaea;
      --blue: #4a7188;
      --shadow: 0 18px 45px rgba(11, 59, 49, 0.12);
      --panel-shadow: 0 5px 14px rgba(18, 52, 43, 0.06);
      --scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(126, 215, 180, 0.2), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(26, 143, 101, 0.12), transparent 26%),
        #dfe8e3;
      color: var(--ink-950);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button,
    select,
    [tabindex] {
      outline: none;
    }

    button:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      box-shadow: 0 0 0 3px rgba(36, 168, 119, 0.26);
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .dashboard {
      position: absolute;
      width: 1600px;
      height: 900px;
      display: grid;
      grid-template-rows: 122px 68px 1fr 52px;
      overflow: hidden;
      background: var(--canvas);
      border: 1px solid rgba(8, 47, 40, 0.12);
      border-radius: 18px;
      box-shadow: var(--shadow);
      transform: scale(var(--scale));
      transform-origin: top left;
      transition: box-shadow 180ms ease;
    }

    .topbar {
      display: grid;
      grid-template-columns: 340px 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 20px 26px;
      color: white;
      background:
        radial-gradient(circle at 8% 10%, rgba(126, 215, 180, 0.17), transparent 24%),
        linear-gradient(105deg, var(--forest-950), var(--forest-900));
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--emerald-300);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
    }

    .page-nav {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .nav-button {
      height: 46px;
      padding: 0 11px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.76);
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      font-size: 12px;
      font-weight: 680;
      line-height: 1.2;
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .nav-button:hover {
      color: white;
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-1px);
    }

    .nav-button.active {
      border-color: var(--mint-200);
      color: var(--forest-950);
      background: var(--mint-100);
      box-shadow: inset 0 -3px 0 var(--emerald-500);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .icon-button:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .filterbar {
      display: grid;
      grid-template-columns: auto repeat(4, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 11px 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .filter-heading {
      padding-right: 8px;
    }

    .filter-heading strong {
      display: block;
      font-size: 12px;
    }

    .filter-heading span {
      display: block;
      margin-top: 2px;
      color: var(--ink-500);
      font-size: 10px;
    }

    .filter-field {
      position: relative;
    }

    .filter-field label {
      position: absolute;
      left: 12px;
      top: 7px;
      z-index: 1;
      color: var(--ink-500);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .filter-field select {
      width: 100%;
      height: 46px;
      padding: 18px 34px 5px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink-950);
      background: var(--mint-50);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .filter-field.filter-disabled {
      opacity: 0.5;
    }

    .filter-field.filter-disabled select {
      cursor: not-allowed;
    }

    .reset-button {
      height: 42px;
      padding: 0 17px;
      border: 1px solid var(--forest-700);
      border-radius: 10px;
      color: var(--forest-800);
      background: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 720;
    }

    .reset-button:hover {
      background: var(--mint-100);
    }

    .content {
      min-height: 0;
      padding: 16px 26px 14px;
    }

    .page {
      display: none;
      height: 100%;
      animation: page-in 240ms ease both;
    }

    .page.active {
      display: block;
    }

    @keyframes page-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      min-height: 44px;
    }

    .page-heading h2 {
      margin: 0;
      color: var(--forest-950);
      font-size: 21px;
      font-weight: 780;
      letter-spacing: -0.025em;
    }

    .page-heading p {
      margin: 5px 0 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .sample-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid #b8dccb;
      border-radius: 9px;
      color: var(--forest-700);
      background: var(--mint-100);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .sample-badge::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-500);
      content: "";
    }

    .page-grid {
      min-height: 0;
      display: grid;
      gap: 12px;
    }

    .overview-grid {
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: 112px 1fr 118px;
    }

    .scope-grid {
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: 112px 1fr 116px;
    }

    .scope3-grid,
    .quality-grid,
    .netzero-grid {
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: 112px 1fr 124px;
    }

    .quality-grid {
      grid-template-rows: 112px 1fr 196px;
    }

    .netzero-grid {
      grid-template-rows: 112px 1fr 136px;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: var(--panel-shadow);
    }

    .panel-inner {
      height: 100%;
      padding: 14px 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .panel-title {
      margin: 0;
      color: var(--forest-950);
      font-size: 12px;
      font-weight: 780;
      letter-spacing: 0.01em;
    }

    .panel-subtitle {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 9.5px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 7px;
      color: var(--forest-700);
      background: var(--mint-100);
      font-size: 9px;
      font-weight: 720;
    }

    .kpi-card {
      grid-column: span 3;
      position: relative;
      overflow: hidden;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      box-shadow: var(--panel-shadow);
    }

    .kpi-card::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--emerald-500);
      content: "";
    }

    .kpi-card.warning::before {
      background: var(--amber);
    }

    .kpi-card.neutral::before {
      background: var(--blue);
    }

    .kpi-label {
      color: var(--ink-500);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .kpi-value-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-top: 6px;
    }

    .kpi-value {
      color: var(--ink-950);
      font-size: 31px;
      font-weight: 790;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .kpi-unit {
      color: var(--ink-500);
      font-size: 10px;
      font-weight: 620;
    }

    .kpi-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      color: var(--ink-500);
      font-size: 9px;
    }

    .delta {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--emerald-600);
      font-weight: 760;
    }

    .delta.bad {
      color: var(--red);
    }

    .chart-panel {
      grid-column: span 6;
    }

    .wide-panel {
      grid-column: span 8;
    }

    .narrow-panel {
      grid-column: span 4;
    }

    .full-panel {
      grid-column: span 12;
    }

    .chart-wrap {
      width: 100%;
      height: calc(100% - 38px);
      min-height: 0;
    }

    .chart-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .chart-grid-line {
      stroke: #e6ece8;
      stroke-width: 1;
    }

    .chart-axis {
      fill: var(--ink-500);
      font-size: 10px;
    }

    .chart-label {
      fill: var(--ink-700);
      font-size: 10px;
      font-weight: 650;
    }

    .chart-value {
      fill: var(--forest-950);
      font-size: 10px;
      font-weight: 780;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      margin-top: 4px;
      color: var(--ink-500);
      font-size: 9px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .insight-panel {
      position: relative;
      background: linear-gradient(135deg, var(--mint-100), white 72%);
    }

    .insight-panel::after {
      position: absolute;
      right: -26px;
      bottom: -35px;
      width: 130px;
      height: 130px;
      border: 22px solid rgba(36, 168, 119, 0.08);
      border-radius: 50%;
      content: "";
    }

    .insight-copy {
      position: relative;
      z-index: 1;
      margin: 10px 0 0;
      color: var(--ink-700);
      font-size: 10.5px;
      line-height: 1.55;
    }

    .insight-copy strong {
      color: var(--forest-900);
    }

    .note-panel .panel-inner {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 18px;
      align-items: center;
    }

    .note-kicker {
      color: var(--forest-700);
      font-size: 10px;
      font-weight: 790;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .note-title {
      margin: 5px 0 0;
      color: var(--forest-950);
      font-size: 14px;
      font-weight: 760;
    }

    .note-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .note-item {
      min-width: 0;
      padding-left: 12px;
      border-left: 2px solid var(--mint-200);
      color: var(--ink-700);
      font-size: 9.5px;
      line-height: 1.45;
    }

    .progress-list {
      display: grid;
      gap: 11px;
      margin-top: 10px;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 118px 1fr 42px;
      gap: 9px;
      align-items: center;
      color: var(--ink-700);
      font-size: 10px;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 5px;
      background: #e7edea;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--forest-700), var(--emerald-500));
    }

    .progress-value {
      text-align: right;
      color: var(--forest-900);
      font-weight: 760;
    }

    .quality-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9.5px;
    }

    .priority-scroll {
      height: calc(100% - 28px);
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 5px;
      scrollbar-color: #9bc6b2 transparent;
      scrollbar-width: thin;
    }

    .priority-scroll:focus-visible {
      border-radius: 8px;
      box-shadow: inset 0 0 0 2px rgba(36, 168, 119, 0.28);
    }

    .priority-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .priority-scroll::-webkit-scrollbar-thumb {
      border: 2px solid white;
      border-radius: 8px;
      background: #9bc6b2;
    }

    .priority-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .quality-table th {
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      color: var(--ink-500);
      background: white;
      text-align: left;
      font-size: 8.5px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .priority-scroll .quality-table th {
      position: sticky;
      z-index: 1;
      top: 0;
    }

    .quality-table td {
      padding: 7px 8px;
      border-bottom: 1px solid #edf1ef;
      color: var(--ink-700);
      vertical-align: middle;
    }

    .quality-table tr:last-child td {
      border-bottom: 0;
    }

    .status {
      display: inline-flex;
      padding: 4px 7px;
      border-radius: 7px;
      font-size: 8.5px;
      font-weight: 760;
    }

    .status.high {
      color: #8f3f3f;
      background: var(--red-soft);
    }

    .status.medium {
      color: #8b641c;
      background: var(--amber-soft);
    }

    .status.ontrack {
      color: var(--forest-700);
      background: var(--mint-100);
    }

    .lever-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      height: 100%;
    }

    .lever {
      position: relative;
      overflow: hidden;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(140deg, white, var(--mint-50));
    }

    .lever-number {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 8px;
      color: white;
      background: var(--forest-800);
      font-size: 10px;
      font-weight: 800;
    }

    .lever h4 {
      margin: 9px 0 4px;
      color: var(--forest-950);
      font-size: 11px;
    }

    .lever p {
      margin: 0;
      color: var(--ink-500);
      font-size: 9px;
      line-height: 1.4;
    }

    .netzero-grid .full-panel .panel-inner {
      padding: 10px 14px;
    }

    .netzero-grid .full-panel .panel-header {
      margin-bottom: 5px;
    }

    .netzero-grid .lever {
      padding: 9px 12px;
    }

    .netzero-grid .lever-list {
      grid-template-columns: repeat(4, 1fr);
      height: auto;
    }

    .netzero-grid .lever h4 {
      margin: 6px 0 3px;
    }

    .netzero-grid .lever p {
      line-height: 1.3;
    }

    .nz-chart-wrap {
      width: 100%;
      height: calc(100% - 38px);
      min-height: 0;
    }

    .nz-chart-wrap svg {
      width: 100%;
      height: calc(100% - 18px);
      overflow: visible;
    }

    .nz-legend {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-top: -4px;
      color: var(--ink-500);
      font-size: 8.5px;
    }

    .nz-legend-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .nz-line-swatch {
      width: 24px;
      border-top: 3px solid var(--forest-700);
    }

    .nz-line-swatch.target {
      border-top-style: dashed;
      border-top-color: var(--emerald-500);
    }

    .milestone-progress {
      display: grid;
      gap: 14px;
      padding-top: 6px;
    }

    .milestone-value {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .milestone-value strong {
      color: var(--forest-950);
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .milestone-value span {
      color: var(--ink-500);
      font-size: 10px;
      font-weight: 650;
    }

    .milestone-track {
      height: 12px;
      overflow: hidden;
      border-radius: 8px;
      background: #e7edea;
    }

    .milestone-track > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--forest-700), var(--emerald-500));
    }

    .milestone-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .milestone-stat {
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--mint-50);
    }

    .milestone-stat strong,
    .milestone-stat span {
      display: block;
    }

    .milestone-stat strong {
      color: var(--forest-950);
      font-size: 13px;
    }

    .milestone-stat span {
      margin-top: 3px;
      color: var(--ink-500);
      font-size: 8px;
    }

    .milestone-note {
      margin: 0;
      color: var(--ink-500);
      font-size: 8.5px;
      line-height: 1.4;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 26px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink-500);
      font-size: 10px;
      transition: opacity 180ms ease;
    }

    .footer-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-meta {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .footer-credit {
      color: var(--ink-700);
      font-weight: 650;
    }

    .footer-separator {
      color: #a9b6b0;
    }

    .linkedin-link {
      width: 19px;
      height: 19px;
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 5px;
      color: white;
      background: #0a66c2;
      transition: transform 150ms ease, background 150ms ease;
    }

    .linkedin-link:hover {
      background: #084f96;
      transform: translateY(-1px);
    }

    .linkedin-link:focus-visible {
      box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.22);
    }

    .linkedin-link svg {
      width: 11px;
      height: 11px;
      fill: currentColor;
    }

    .pager-button {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--forest-800);
      background: white;
      cursor: pointer;
    }

    .pager-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .pager-button svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;

        { fy: "FY2026", entity: "Corporate", facility: "Melbourne HQ", scope: "Scope 3", source: "Purchased goods", category: "Category 1", method: "Spend-based", dataBasis: "Financial activity data", supplierSpecific: false, emissions: 285, energy: 0, renewable: 0, coverage: 91 },

        { fy: "FY2026", entity: "Operations", facility: "Brisbane Hub", scope: "Scope 3", source: "Fuel and energy activities", category: "Category 3", method: "Supplier-specific", dataBasis: "Mixed data", supplierSpecific: true, emissions: 60, energy: 0, renewable: 0, coverage: 93 },

        { fy: "FY2026", entity: "Retail", facility: "Brisbane Hub", scope: "Scope 3", source: "Downstream transport", category: "Category 9", method: "Spend-based", dataBasis: "Financial activity data", supplierSpecific: false, emissions: 125, energy: 0, renewable: 0, coverage: 83 }
      ];

      const TARGETS = [
        { fy: "FY2025", label: "Baseline", emissions: 1240 },
        { fy: "FY2030", label: "Near-term target", emissions: 806 },
        { fy: "FY2040", label: "Interim target", emissions: 310 },
        { fy: "FY2050", label: "Net-zero target", emissions: 0 }
      ];

      function filterRecords(records, filters) {
        return records.filter((record) => Object.entries(filters).every(([key, value]) => value === "All" || record[key] === value));
      }

      function sum(records, field) {
        return records.reduce((total, record) => total + (Number(record[field]) || 0), 0);
      }

      function pctChange(current, prior) {
        if (!prior) return 0;
        return ((current - prior) / prior) * 100;
      }

      function groupSum(records, key, field) {
        return records.reduce((groups, record) => {
          groups[record[key]] = (groups[record[key]] || 0) + (Number(record[field]) || 0);
          return groups;
        }, {});
      }

      function weightedAverage(records, valueField, weightField = "emissions") {
        const weight = sum(records, weightField);
        if (!weight) return 0;
        return records.reduce((total, record) => total + (Number(record[valueField]) || 0) * (Number(record[weightField]) || 0), 0) / weight;
      }

      function getSummary(records) {
        return {
          total: sum(records, "emissions"),
          byScope: groupSum(records, "scope", "emissions"),
          bySource: groupSum(records, "source", "emissions"),
          byFacility: groupSum(records, "facility", "emissions"),
          byMethod: groupSum(records, "method", "emissions"),
          energy: sum(records, "energy"),
          locationEmissions: sum(records, "locationEmissions"),
          renewable: weightedAverage(records.filter((record) => record.scope === "Scope 2"), "renewable"),
          coverage: weightedAverage(records, "coverage")
        };
      }

      function getQualityMetrics(records) {
        const total = sum(records, "emissions");
        const scope3Records = records.filter((record) => record.scope === "Scope 3");
        const scope3Total = sum(scope3Records, "emissions");
        return {
          inventoryCoverage: records.length ? sum(records, "coverage") / records.length : 0,
          physicalShare: total ? sum(records.filter((record) => record.dataBasis === "Physical activity data"), "emissions") / total * 100 : 0,
          spendShare: total ? sum(records.filter((record) => record.dataBasis === "Financial activity data"), "emissions") / total * 100 : 0,
          supplierSpecificShare: scope3Total ? sum(scope3Records.filter((record) => record.supplierSpecific), "emissions") / scope3Total * 100 : null,
          methodMix: groupSum(records, "method", "emissions")
        };
      }

      function fitCanvas(viewportWidth, viewportHeight, padding = 18) {
        const availableWidth = Math.max(0, viewportWidth - padding * 2);
        const availableHeight = Math.max(0, viewportHeight - padding * 2);
        const scale = Math.min(availableWidth / 1600, availableHeight / 900);
        return {
          scale,
          left: (viewportWidth - 1600 * scale) / 2,
          top: (viewportHeight - 900 * scale) / 2
        };
      }

      function shouldIgnoreArrow(tagName) {
        return ["SELECT", "INPUT", "TEXTAREA"].includes(String(tagName).toUpperCase());
      }

      function recordsForPeriod(records, financialYear) {
        if (financialYear === "All") return records;
        return records.filter((record) => record.fy === financialYear);
      }

      function periodLabel(financialYear) {
        return financialYear === "All" ? "FY2025 + FY2026 combined" : financialYear;
      }

      function hasSubsetFilter(filters) {
        return ["entity", "facility", "method"].some((field) => filters[field] && filters[field] !== "All");
      }

      function getActualTrendPoints(fy2025Total, fy2026Total) {
        return [
          { label: "FY2025", note: "Baseline", value: Number(fy2025Total) || 0 },
          { label: "FY2026", note: "Latest actual", value: Number(fy2026Total) || 0 }
        ];
      }

      function getNetZeroView(financialYear, fy2025Total, fy2026Total) {
        const baseline = Number(fy2025Total) || 0;
        const current = financialYear === "FY2025" ? baseline : Number(fy2026Total) || 0;
        const reductionAchieved = baseline - current;
        const reductionPercent = baseline ? (reductionAchieved / baseline) * 100 : 0;
        const target2030 = TARGETS.find((target) => target.fy === "FY2030").emissions;
        const totalReductionRequired = Math.max(0, baseline - target2030);
        const gapTo2030 = Math.max(0, current - target2030);
        const progressTo2030 = totalReductionRequired
          ? Math.max(0, Math.min(100, reductionAchieved / totalReductionRequired * 100))
          : 0;
        const actualPoints = [
          { label: "FY2025", note: "Baseline", value: baseline }
        ];

        if (financialYear !== "FY2025") {
          actualPoints.push({ label: "FY2026", note: "Latest actual", value: current });
        }

        const targetPoints = TARGETS.slice(1).map((target) => ({
          label: target.fy,
          note: target.label,
          value: target.emissions
        }));

        return {
          baseline,
          current,
          currentLabel: financialYear === "All" ? "Latest actual" : `${financialYear} actual`,
          reductionAchieved,
          reductionPercent,
          target2030,
          totalReductionRequired,
          gapTo2030,
          progressTo2030,
          points: [...actualPoints, ...targetPoints],
          highlightLabel: financialYear === "FY2025" ? "FY2025" : "FY2026"
        };
      }

      return { DATA, TARGETS, filterRecords, sum, pctChange, groupSum, weightedAverage, getSummary, getQualityMetrics, fitCanvas, shouldIgnoreArrow, recordsForPeriod, periodLabel, hasSubsetFilter, getActualTrendPoints, getNetZeroView };
    })();

  <script>
    (() => {

      const pages = ["overview", "scope1", "scope2", "scope3", "quality", "netzero"];

        scope1: "Scope 1",
        scope2: "Scope 2",
        scope3: "Scope 3",
        quality: "Data Quality & Methodology",
        netzero: "Net Zero Pathway"
      };
      const state = {
        page: pages.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview",
        filters: { fy: "FY2026", entity: "All", facility: "All", method: "All" },
        presentation: false
      };
      const content = document.getElementById("content");
      const tooltip = document.getElementById("tooltip");
      const dashboard = document.getElementById("dashboard");
      const numberFormat = new Intl.NumberFormat("en-AU", { maximumFractionDigits: 0 });
      const oneDecimal = new Intl.NumberFormat("en-AU", { maximumFractionDigits: 1, minimumFractionDigits: 1 });

      function formatNumber(value) {
        return numberFormat.format(Math.round(value || 0));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function scaleDashboard() {
        const fit = core.fitCanvas(window.innerWidth, window.innerHeight, 18);
        document.documentElement.style.setProperty("--scale", Math.max(0.3, fit.scale).toFixed(6));
        dashboard.style.left = `${fit.left}px`;
        dashboard.style.top = `${fit.top}px`;
      }

      function filterBaseRecords(includeYear = true) {
        const filters = { ...state.filters };
        if (!includeYear) filters.fy = "All";
        return core.filterRecords(core.DATA, filters);
      }

      function selectedYear() {
        return core.periodLabel(state.filters.fy);
      }

      function currentRecords() {
        return core.recordsForPeriod(filterBaseRecords(false), state.filters.fy);
      }

      function comparableRecords(fy) {
        return filterBaseRecords(false).filter((record) => record.fy === fy);
      }

      function corporateCurrentRecords() {
        return core.recordsForPeriod(core.DATA, state.filters.fy);
      }

      function corporateComparableRecords(fy) {
        return core.DATA.filter((record) => record.fy === fy);
      }

      function syncFilterAvailability() {
        const corporatePathway = state.page === "netzero";
        const heading = document.querySelector(".filter-heading");
        heading.querySelector("strong").textContent = corporatePathway ? "Corporate pathway view" : "Reporting view";
        heading.querySelector("span").textContent = corporatePathway ? "Only Financial Year applies" : "Filters update connected visuals";
        ["entity", "facility", "method"].forEach((field) => {
          const select = document.querySelector(`[data-filter="${field}"]`);
          select.disabled = corporatePathway;
          select.title = corporatePathway ? "This filter is not applied to the corporate Net Zero pathway" : "";
          select.closest(".filter-field").classList.toggle("filter-disabled", corporatePathway);
        });
      }

      function sampleBadge() {
        return '<span class="sample-badge">Illustrative portfolio data</span>';
      }

      function pageHeading(title, subtitle) {
        return `
          <div class="page-heading">
            <div>
              <h2>${escapeHtml(title)}</h2>
              <p>${escapeHtml(subtitle)}</p>
            </div>
            ${sampleBadge()}
          </div>`;
      }

      function kpiCard(label, value, unit, foot, delta, tone = "") {
        const deltaClass = delta && delta.bad ? "delta bad" : "delta";
        return `
          <article class="kpi-card ${tone}">
            <div class="kpi-label">${escapeHtml(label)}</div>
            <div class="kpi-value-row">
              <div class="kpi-value">${escapeHtml(value)}</div>
              ${unit ? `<div class="kpi-unit">${escapeHtml(unit)}</div>` : ""}
            </div>
            <div class="kpi-foot">
              <span>${escapeHtml(foot || "")}</span>
              ${delta ? `<span class="${deltaClass}">${escapeHtml(delta.text)}</span>` : ""}
            </div>
          </article>`;
      }

      function panel(title, subtitle, body, classes = "", tag = "") {
        return `
          <article class="panel ${classes}">
            <div class="panel-inner">
              <div class="panel-header">
                <div>
                  <h3 class="panel-title">${escapeHtml(title)}</h3>
                  ${subtitle ? `<p class="panel-subtitle">${escapeHtml(subtitle)}</p>` : ""}
                </div>
                ${tag ? `<span class="tag">${escapeHtml(tag)}</span>` : ""}
              </div>
              ${body}
            </div>
          </article>`;
      }

      function emptyState() {
        return `
          <div class="empty-state">
            <div><strong>No matching sample data</strong>Reset one or more filters to restore the dashboard view.</div>
          </div>`;
      }

      function niceMax(value) {
        if (value <= 0) return 1;
        const magnitude = 10 ** Math.floor(Math.log10(value));
        return Math.ceil(value / magnitude) * magnitude;
      }

      function barChart(items, options = {}) {
        if (!items.length) return emptyState();
        const width = 680;
        const height = 260;
        const horizontal = options.horizontal || false;
        const colors = options.colors || ["#1a8f65", "#4a7188", "#d89528", "#7ed7b4", "#c65656"];
        const max = niceMax(Math.max(...items.map((item) => item.value)));
        if (horizontal) {
          const rowHeight = Math.min(43, 205 / items.length);
          const bars = items.map((item, index) => {
            const y = 28 + index * rowHeight;
            const barWidth = Math.max(2, (item.value / max) * 430);
            return `
              <text x="10" y="${y + 14}" class="chart-label">${escapeHtml(item.label)}</text>
              <rect x="150" y="${y}" width="430" height="18" rx="6" fill="#edf2ef"/>
              <rect x="150" y="${y}" width="${barWidth}" height="18" rx="6" fill="${colors[index % colors.length]}" tabindex="0" data-tip="${escapeHtml(item.label)}: ${formatNumber(item.value)} tCO2e">
                <title>${escapeHtml(item.label)}: ${formatNumber(item.value)} tCO2e</title>
              </rect>
              <text x="${Math.min(610, 158 + barWidth)}" y="${y + 13}" class="chart-value">${formatNumber(item.value)}</text>`;
          }).join("");
          return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(options.ariaLabel || "Horizontal bar chart")}">${bars}</svg></div>`;
        }
        const plotLeft = 48;
        const plotTop = 24;
        const plotWidth = 590;
        const plotHeight = 178;
        const gap = plotWidth / items.length;
        const barWidth = Math.min(74, gap * 0.56);
        const grid = [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
          const y = plotTop + plotHeight - ratio * plotHeight;
          return `<line x1="${plotLeft}" y1="${y}" x2="${plotLeft + plotWidth}" y2="${y}" class="chart-grid-line"/><text x="40" y="${y + 4}" text-anchor="end" class="chart-axis">${formatNumber(max * ratio)}</text>`;
        }).join("");
        const bars = items.map((item, index) => {
          const x = plotLeft + index * gap + (gap - barWidth) / 2;
          const barHeight = Math.max(2, (item.value / max) * plotHeight);
          const y = plotTop + plotHeight - barHeight;
          return `
            <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="7" fill="${colors[index % colors.length]}" tabindex="0" data-tip="${escapeHtml(item.label)}: ${formatNumber(item.value)} tCO2e">
              <title>${escapeHtml(item.label)}: ${formatNumber(item.value)} tCO2e</title>
            </rect>
            <text x="${x + barWidth / 2}" y="${Math.max(16, y - 7)}" text-anchor="middle" class="chart-value">${formatNumber(item.value)}</text>
            <text x="${x + barWidth / 2}" y="${plotTop + plotHeight + 20}" text-anchor="middle" class="chart-label">${escapeHtml(item.label)}</text>`;
        }).join("");
        return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(options.ariaLabel || "Bar chart")}">${grid}${bars}</svg></div>`;
      }

      function donutChart(items, centerLabel, centerValue) {
        if (!items.length || items.every((item) => item.value === 0)) return emptyState();
        const total = items.reduce((sum, item) => sum + item.value, 0);
        const colors = ["#176b55", "#4a7188", "#d89528", "#7ed7b4", "#c65656", "#94a39d", "#d2e7dc"];
        let offset = 0;
        const circles = items.map((item, index) => {
          const fraction = item.value / total;
          const dash = fraction * 100;
          const currentOffset = -offset;
          offset += dash;
          return `
            <circle cx="122" cy="122" r="74" fill="none" stroke="${colors[index % colors.length]}" stroke-width="34" pathLength="100" stroke-dasharray="${dash} ${100 - dash}" stroke-dashoffset="${currentOffset}" transform="rotate(-90 122 122)" tabindex="0" data-tip="${escapeHtml(item.label)}: ${formatNumber(item.value)} tCO2e">
              <title>${escapeHtml(item.label)}: ${formatNumber(item.value)} tCO2e</title>
            </circle>`;
        }).join("");
        const legend = items.map((item, index) => `
          <div class="legend-item"><span class="legend-dot" style="background:${colors[index % colors.length]}"></span><span>${escapeHtml(item.label)} ${oneDecimal.format((item.value / total) * 100)}%</span></div>`).join("");
        return `
          <div style="height:calc(100% - 38px);display:grid;grid-template-columns:250px 1fr;align-items:center;gap:12px">
            <svg viewBox="0 0 245 245" role="img" aria-label="Emissions composition donut chart">
              <circle cx="122" cy="122" r="74" fill="none" stroke="#edf2ef" stroke-width="34"/>
              ${circles}
              <text x="122" y="116" text-anchor="middle" class="chart-value" style="font-size:25px">${escapeHtml(centerValue)}</text>
              <text x="122" y="137" text-anchor="middle" class="chart-axis">${escapeHtml(centerLabel)}</text>
            </svg>
            <div class="legend">${legend}</div>
          </div>`;
      }

      function lineChart(points, options = {}) {
        if (!points.length) return emptyState();
        const width = 720;
        const height = 270;
        const left = 54;
        const top = 28;
        const plotWidth = 620;
        const plotHeight = 176;
        const max = niceMax(Math.max(...points.map((point) => point.value), 100));
        const coords = points.map((point, index) => ({
          ...point,
          x: left + (index * plotWidth) / Math.max(1, points.length - 1),
          y: top + plotHeight - (point.value / max) * plotHeight
        }));
        const grid = [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
          const y = top + plotHeight - ratio * plotHeight;
          return `<line x1="${left}" y1="${y}" x2="${left + plotWidth}" y2="${y}" class="chart-grid-line"/><text x="${left - 10}" y="${y + 4}" text-anchor="end" class="chart-axis">${formatNumber(max * ratio)}</text>`;
        }).join("");
        const solidPath = coords.length > 1 ? coords.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`).join(" ") : "";
        const areaPath = coords.length > 1 ? `${solidPath} L ${coords.at(-1).x} ${top + plotHeight} L ${coords[0].x} ${top + plotHeight} Z` : "";
        const dots = coords.map((point, index) => {
          const isHighlighted = options.highlightLabel
            ? point.label === options.highlightLabel
            : index === 1 && options.highlightCurrent;
          return `
          <line x1="${point.x}" y1="${point.y}" x2="${point.x}" y2="${top + plotHeight}" stroke="#dce5e0" stroke-dasharray="3 5"/>
          <circle cx="${point.x}" cy="${point.y}" r="${isHighlighted ? 7 : 5}" fill="${isHighlighted ? "#24a877" : "#0b3b31"}" stroke="white" stroke-width="3" tabindex="0" data-tip="${escapeHtml(point.label)}: ${formatNumber(point.value)} tCO2e">
            <title>${escapeHtml(point.label)}: ${formatNumber(point.value)} tCO2e</title>
          </circle>
          <text x="${point.x}" y="${point.y - 13}" text-anchor="middle" class="chart-value">${formatNumber(point.value)}</text>
          <text x="${point.x}" y="${top + plotHeight + 21}" text-anchor="middle" class="chart-label">${escapeHtml(point.label)}</text>
          <text x="${point.x}" y="${top + plotHeight + 36}" text-anchor="middle" class="chart-axis">${escapeHtml(point.note || "")}</text>`;
        }).join("");
        return `
          <div class="chart-wrap">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(options.ariaLabel || "Emissions pathway chart")}">
              <defs>
                <linearGradient id="${escapeHtml(options.gradientId || "areaGradient")}" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stop-color="#7ed7b4" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#7ed7b4" stop-opacity="0.03"/>
                </linearGradient>
              </defs>
              ${grid}
              ${areaPath ? `<path d="${areaPath}" fill="url(#${escapeHtml(options.gradientId || "areaGradient")})"/>` : ""}
              ${solidPath ? `<path d="${solidPath}" fill="none" stroke="#176b55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
              ${dots}
            </svg>
          </div>`;
      }

      function netZeroPathwayChart(view) {
        const width = 720;
        const height = 250;
        const left = 54;
        const top = 28;
        const plotWidth = 620;
        const plotHeight = 166;
        const max = Math.max(1500, niceMax(Math.max(...view.points.map((point) => point.value), 100)));
        const coords = view.points.map((point, index) => ({
          ...point,
          type: point.label === "FY2025" || point.label === "FY2026" ? "actual" : "target",
          x: left + (index * plotWidth) / Math.max(1, view.points.length - 1),
          y: top + plotHeight - (point.value / max) * plotHeight
        }));
        const actualPoints = coords.filter((point) => point.type === "actual");
        const futureTargets = coords.filter((point) => point.type === "target");
        const targetPoints = actualPoints.length ? [actualPoints.at(-1), ...futureTargets] : futureTargets;
        const pathFor = (points) => points.length > 1
          ? points.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`).join(" ")
          : "";
        const actualPath = pathFor(actualPoints);
        const targetPath = pathFor(targetPoints);
        const targetArea = targetPath
          ? `${targetPath} L ${targetPoints.at(-1).x} ${top + plotHeight} L ${targetPoints[0].x} ${top + plotHeight} Z`
          : "";
        const grid = [0, 0.3333, 0.6667, 1].map((ratio) => {
          const value = max * ratio;
          const y = top + plotHeight - ratio * plotHeight;
          return `<line x1="${left}" y1="${y}" x2="${left + plotWidth}" y2="${y}" class="chart-grid-line"/><text x="${left - 10}" y="${y + 4}" text-anchor="end" class="chart-axis">${formatNumber(value)}</text>`;
        }).join("");
        const dots = coords.map((point) => {
          const isCurrent = point.label === view.highlightLabel;
          return `
            <line x1="${point.x}" y1="${point.y}" x2="${point.x}" y2="${top + plotHeight}" stroke="#dce5e0" stroke-dasharray="3 5"/>
            <circle cx="${point.x}" cy="${point.y}" r="${isCurrent ? 7 : 5}" fill="${point.type === "actual" ? (isCurrent ? "#24a877" : "#0b3b31") : "white"}" stroke="${point.type === "actual" ? "white" : "#24a877"}" stroke-width="3" tabindex="0" data-tip="${escapeHtml(point.label)}: ${formatNumber(point.value)} tCO2e">
              <title>${escapeHtml(point.label)}: ${formatNumber(point.value)} tCO2e</title>
            </circle>
            <text x="${point.x}" y="${point.y - 13}" text-anchor="middle" class="chart-value">${formatNumber(point.value)}</text>
            <text x="${point.x}" y="${top + plotHeight + 20}" text-anchor="middle" class="chart-label">${escapeHtml(point.label)}</text>
            <text x="${point.x}" y="${top + plotHeight + 34}" text-anchor="middle" class="chart-axis">${escapeHtml(point.note)}</text>`;
        }).join("");
        const lastActual = actualPoints.at(-1);
        const target2030Point = futureTargets.find((point) => point.label === "FY2030");
        const calloutX = lastActual && target2030Point ? (lastActual.x + target2030Point.x) / 2 : 311;
        return `
          <div class="nz-chart-wrap">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Actual emissions and net-zero target pathway">
              <defs>
                <linearGradient id="netzeroPathwayGradient" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stop-color="#7ed7b4" stop-opacity="0.28"/>
                  <stop offset="100%" stop-color="#7ed7b4" stop-opacity="0.02"/>
                </linearGradient>
              </defs>
              ${grid}
              ${targetArea ? `<path d="${targetArea}" fill="url(#netzeroPathwayGradient)"/>` : ""}
              ${actualPath ? `<path d="${actualPath}" fill="none" stroke="#176b55" stroke-width="3" stroke-linecap="round"/>` : ""}
              ${targetPath ? `<path d="${targetPath}" fill="none" stroke="#24a877" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>` : ""}
              <rect x="500" y="4" width="174" height="34" rx="8" fill="#e8f7ef" stroke="#cceede"/>
              <text x="587" y="17" text-anchor="middle" class="chart-value" style="font-size:8.5px">FY2050 NET TARGET: 0 tCO2e</text>
              <text x="587" y="29" text-anchor="middle" class="chart-axis" style="font-size:7.5px">90% gross cut + 10% neutralization</text>
              <rect x="${calloutX - 61}" y="72" width="122" height="22" rx="7" fill="#fff4d9" stroke="#f0d59a"/>
              <text x="${calloutX}" y="86" text-anchor="middle" class="chart-value" style="font-size:8px">${formatNumber(view.gapTo2030)} tCO2e remaining</text>
              ${dots}
            </svg>
            <div class="nz-legend"><span class="nz-legend-item"><span class="nz-line-swatch"></span>Reported actual</span><span class="nz-legend-item"><span class="nz-line-swatch target"></span>Approved target pathway</span></div>
          </div>`;
      }

      function methodMixChart(items) {
        const visibleItems = items.filter((item) => item.value > 0).sort((a, b) => b.value - a.value);
        if (!visibleItems.length) return emptyState();
        const total = visibleItems.reduce((sum, item) => sum + item.value, 0);
        const max = Math.max(...visibleItems.map((item) => item.value), 1);
        const height = visibleItems.length * 30 + 12;
        const colors = {
          "Supplier-specific": "#176b55",
          "Electricity consumption-based": "#4a7188",
          "Distance-based": "#5f8f79",
          "Fuel consumption-based": "#8b7554",
          "Waste-type-specific": "#786b9b",
          "Refrigerant mass-balance": "#b27b59",
          "Spend-based": "#c65656"
        };
        const rows = visibleItems.map((item, index) => {
          const y = index * 30 + 4;
          const width = item.value / max * 350;
          const share = total ? item.value / total * 100 : 0;
          return `
            <text x="8" y="${y + 16}" class="chart-label">${escapeHtml(item.label)}</text>
            <rect x="218" y="${y + 3}" width="350" height="16" rx="8" fill="#edf1ef"/>
            <rect x="218" y="${y + 3}" width="${width}" height="16" rx="8" fill="${colors[item.label] || "#4a7188"}" tabindex="0" data-tip="${escapeHtml(item.label)}: ${oneDecimal.format(share)}%">
              <title>${escapeHtml(item.label)}: ${oneDecimal.format(share)}%</title>
            </rect>
            <text x="622" y="${y + 16}" text-anchor="end" class="chart-value">${oneDecimal.format(share)}%</text>`;
        }).join("");
        return `<div class="method-mix"><svg viewBox="0 0 640 ${height}" role="img" aria-label="Emissions-weighted calculation method mix">${rows}</svg></div>`;
      }

      function scopedPath(scope, currentValue, currentLabel) {
        const base = core.sum(comparableRecords("FY2025").filter((record) => record.scope === scope), "emissions");
        const share = base / 1240;
        return [
          { label: "FY2025", note: "Baseline", value: base },
          { label: currentLabel, note: "Current", value: currentValue },
          { label: "FY2030", note: "Target share", value: 806 * share },
          { label: "FY2040", note: "Target share", value: 310 * share },
          { label: "FY2050", note: "Net zero", value: 0 }
        ];
      }

      function renderOverview(records) {
        const summary = core.getSummary(records);
        const baseline = core.getSummary(comparableRecords("FY2025"));
        const latestActual = core.getSummary(comparableRecords("FY2026"));
        const comparisonTotal = state.filters.fy === "FY2025" ? baseline.total : latestActual.total;
        const change = core.pctChange(comparisonTotal, baseline.total);
        const currentLabel = selectedYear();
        const hasSubsetFilter = core.hasSubsetFilter(state.filters);
        const corporateView = core.getNetZeroView(
          state.filters.fy,
          core.sum(corporateComparableRecords("FY2025"), "emissions"),
          core.sum(corporateComparableRecords("FY2026"), "emissions")
        );
        const pathwayPoints = hasSubsetFilter
          ? core.getActualTrendPoints(baseline.total, latestActual.total)
          : corporateView.points;
        const pathwayTitle = hasSubsetFilter ? "Selected view: baseline and actual" : "Corporate baseline, actual and pathway";
        const pathwaySubtitle = hasSubsetFilter
          ? "Comparable annual actuals; no target is allocated to this filtered view"
          : "Historical baseline and future target trajectory";
        const pathwayTag = hasSubsetFilter ? "No allocated target" : "FY2050 net zero";
        const totalDelta = state.filters.fy === "All"
          ? { text: "Combined reporting periods" }
          : { text: `${change <= 0 ? "↓" : "↑"} ${oneDecimal.format(Math.abs(change))}% vs baseline`, bad: change > 0 };
        const targetCard = hasSubsetFilter
          ? kpiCard("FY2030 gap", "N/A", "", "Selected view", { text: "Corporate target only" }, "neutral")
          : kpiCard("Reduction to FY2030", formatNumber(corporateView.gapTo2030), "tCO2e", "Remaining", { text: "Target 806 tCO2e", bad: corporateView.gapTo2030 > 0 }, "warning");
        const composition = ["Scope 1", "Scope 2", "Scope 3"].map((scope) => ({ label: scope, value: summary.byScope[scope] || 0 }));
        const insightScope = composition.slice().sort((a, b) => b.value - a.value)[0];
        const executiveReading = hasSubsetFilter
          ? `<p class="insight-copy"><strong>${escapeHtml(insightScope.label)}</strong> is the largest reported source at <strong>${oneDecimal.format(summary.total ? insightScope.value / summary.total * 100 : 0)}%</strong> of the selected view. FY2026 emissions are <strong>${oneDecimal.format(Math.abs(change))}% ${change <= 0 ? "below" : "above"}</strong> the comparable FY2025 baseline. No reduction target is allocated to this filtered view. Reset Entity, Facility and Calculation Method to see the corporate pathway.</p>`
          : `<p class="insight-copy"><strong>${escapeHtml(insightScope.label)}</strong> is the largest reported source at <strong>${oneDecimal.format(summary.total ? insightScope.value / summary.total * 100 : 0)}%</strong> of the selected view. Current emissions are <strong>${oneDecimal.format(Math.abs(change))}% ${change <= 0 ? "below" : "above"}</strong> the FY2025 baseline. The next decision point is closing the <strong>${formatNumber(corporateView.gapTo2030)} tCO2e</strong> gap to the FY2030 pathway.</p>`;
        return `
          <section class="page active" id="page-overview">
            <div class="page-shell">
              ${pageHeading("Executive Overview", hasSubsetFilter ? `Reported GHG performance for ${currentLabel} compared with the equivalent FY2025 view` : `Reported GHG performance for ${currentLabel} compared with the FY2025 baseline and approved pathway`)}
              <div class="page-grid overview-grid">
                ${kpiCard("Total reported emissions", formatNumber(summary.total), "tCO2e", currentLabel, totalDelta)}
                ${kpiCard("Renewable electricity", `${oneDecimal.format(summary.renewable)}%`, "", "Facilities", { text: `${summary.renewable >= 50 ? "Above" : "Below"} halfway` }, "neutral")}
                ${kpiCard("Data coverage", `${oneDecimal.format(summary.coverage)}%`, "", "Emissions weighted", { text: summary.coverage >= 90 ? "Strong coverage" : "Needs attention" })}
                ${targetCard}
                ${panel("GHG emissions composition", "Reported emissions by scope", donutChart(composition, "tCO2e", formatNumber(summary.total)), "chart-panel")}
                ${panel(pathwayTitle, pathwaySubtitle, lineChart(pathwayPoints, { highlightLabel: hasSubsetFilter ? "FY2026" : corporateView.highlightLabel, gradientId: "overviewGradient" }), "chart-panel", pathwayTag)}
                ${panel("Executive reading", "", executiveReading, "narrow-panel insight-panel")}
                ${panel("Reporting boundary", "", `<div class="note-list"><div class="note-item">Scope 1 covers controlled fuel use and refrigerants.</div><div class="note-item">Scope 2 uses market-based results for the reported total.</div><div class="note-item">Scope 3 categories shown are those relevant to this illustrative company.</div></div>`, "wide-panel note-panel")}
              </div>
            </div>
          </section>`;
      }

      function renderScope1(records) {
        const scopeRecords = records.filter((record) => record.scope === "Scope 1");
        const summary = core.getSummary(scopeRecords);
        const baselineRecords = comparableRecords("FY2025").filter((record) => record.scope === "Scope 1");
        const baseline = core.sum(baselineRecords, "emissions");
        const change = core.pctChange(summary.total, baseline);
        const sources = ["Mobile combustion", "Stationary combustion", "Fugitive emissions"].map((source) => ({ label: source.replace(" combustion", ""), value: summary.bySource[source] || 0 }));
        const fleetFuel = scopeRecords.filter((record) => record.source === "Mobile combustion");
        const fleetCurrent = core.sum(fleetFuel, "emissions");
        return `
          <section class="page active" id="page-scope1">
            <div class="page-shell">
              ${pageHeading("Scope 1", `Direct emissions performance for ${selectedYear()} with source and pathway context`)}
              <div class="page-grid scope-grid">
                ${kpiCard("Scope 1 emissions", formatNumber(summary.total), "tCO2e", selectedYear(), { text: `${change <= 0 ? "↓" : "↑"} ${oneDecimal.format(Math.abs(change))}% vs baseline`, bad: change > 0 })}
                ${kpiCard("Mobile combustion", formatNumber(summary.bySource["Mobile combustion"] || 0), "tCO2e", "Fleet fuel", { text: `${oneDecimal.format(summary.total ? (summary.bySource["Mobile combustion"] || 0) / summary.total * 100 : 0)}% of Scope 1` })}
                ${kpiCard("Stationary combustion", formatNumber(summary.bySource["Stationary combustion"] || 0), "tCO2e", "Backup generation", { text: "Applicable source" }, "neutral")}
                ${kpiCard("Fugitive emissions", formatNumber(summary.bySource["Fugitive emissions"] || 0), "tCO2e", "Refrigerants", { text: "HVAC systems" }, "warning")}
                ${panel("Scope 1 pathway", "Baseline, current performance and pathway share", lineChart(scopedPath("Scope 1", summary.total, selectedYear()), { highlightCurrent: true, gradientId: "scope1Gradient" }), "wide-panel", "Direct emissions")}
                ${panel("Emissions by source", "Contribution to selected Scope 1 view", barChart(sources, { ariaLabel: "Scope 1 emissions by source" }), "narrow-panel")}
                ${panel("Operational note", "", `<div class="note-list"><div class="note-item"><strong>Process emissions are not applicable to Company X</strong> because it has no related operations that generate process emissions.</div><div class="note-item">Mobile combustion remains the largest direct source at ${formatNumber(fleetCurrent)} tCO2e.</div><div class="note-item">The fleet pathway assumes progressive vehicle replacement aligned with asset cycles.</div></div>`, "wide-panel note-panel")}
                ${panel("Fleet transition", "", `<div class="progress-list"><div class="progress-row"><span>Electric vehicles</span><div class="progress-track"><div class="progress-fill" style="width:38%"></div></div><span class="progress-value">38%</span></div><div class="progress-row"><span>Fuel data coverage</span><div class="progress-track"><div class="progress-fill" style="width:96%"></div></div><span class="progress-value">96%</span></div></div>`, "narrow-panel")}
              </div>
            </div>
          </section>`;
      }

      function renderScope2(records) {
        const scopeRecords = records.filter((record) => record.scope === "Scope 2");
        const summary = core.getSummary(scopeRecords);
        const baselineRecords = comparableRecords("FY2025").filter((record) => record.scope === "Scope 2");
        const baseline = core.sum(baselineRecords, "emissions");
        const change = core.pctChange(summary.total, baseline);
        const facilities = Object.entries(summary.byFacility).map(([label, value]) => ({ label: label.replace(" Operations", "").replace(" Hub", ""), value })).sort((a, b) => b.value - a.value);
        return `
          <section class="page active" id="page-scope2">
            <div class="page-shell">
              ${pageHeading("Scope 2", `Purchased electricity performance for ${selectedYear()} compared with baseline and pathway`)}
              <div class="page-grid scope-grid">
                ${kpiCard("Market-based emissions", formatNumber(summary.total), "tCO2e", selectedYear(), { text: `${change <= 0 ? "↓" : "↑"} ${oneDecimal.format(Math.abs(change))}% vs baseline`, bad: change > 0 })}
                ${kpiCard("Location-based emissions", formatNumber(summary.locationEmissions), "tCO2e", "Grid average", { text: `${formatNumber(Math.max(0, summary.locationEmissions - summary.total))} tCO2e difference` }, "neutral")}
                ${kpiCard("Electricity consumption", formatNumber(summary.energy), "GJ", "Selected facilities", { text: "Activity data" })}
                ${kpiCard("Renewable electricity", `${oneDecimal.format(summary.renewable)}%`, "", "RE100 progress", { text: `${oneDecimal.format(Math.max(0, 100 - summary.renewable))} pts remaining` }, "warning")}
                ${panel("Scope 2 pathway", "FY2025 baseline, current result and target trajectory", lineChart(scopedPath("Scope 2", summary.total, selectedYear()), { highlightCurrent: true, gradientId: "scope2Gradient" }), "wide-panel", "Market-based")}
                ${panel("Facility comparison", "Market-based emissions by facility", barChart(facilities, { horizontal: true, ariaLabel: "Scope 2 emissions by facility" }), "narrow-panel")}
                ${panel("Renewable electricity progress", "", `<div class="progress-list"><div class="progress-row"><span>Melbourne HQ</span><div class="progress-track"><div class="progress-fill" style="width:68%"></div></div><span class="progress-value">68%</span></div><div class="progress-row"><span>Sydney Operations</span><div class="progress-track"><div class="progress-fill" style="width:64%"></div></div><span class="progress-value">64%</span></div><div class="progress-row"><span>Brisbane Hub</span><div class="progress-track"><div class="progress-fill" style="width:54%"></div></div><span class="progress-value">54%</span></div></div>`, "wide-panel")}
                ${panel("Management focus", "", `<p class="insight-copy">The RE100 pathway requires contract coverage to move from <strong>${oneDecimal.format(summary.renewable)}%</strong> to 100%. Priority should go to the facility with the lowest renewable electricity share while maintaining complete invoice and meter evidence.</p>`, "narrow-panel insight-panel")}
              </div>
            </div>
          </section>`;
      }

      function renderScope3(records) {
        const scopeRecords = records.filter((record) => record.scope === "Scope 3");
        const summary = core.getSummary(scopeRecords);
        const quality = core.getQualityMetrics(scopeRecords);
        const baselineRecords = comparableRecords("FY2025").filter((record) => record.scope === "Scope 3");
        const baseline = core.sum(baselineRecords, "emissions");
        const change = core.pctChange(summary.total, baseline);
        const categories = Object.entries(summary.bySource).map(([label, value]) => ({ label: label.length > 22 ? `${label.slice(0, 20)}...` : label, value })).sort((a, b) => b.value - a.value);
        const topTwo = categories.slice(0, 2).reduce((total, item) => total + item.value, 0);
        const methods = Object.entries(quality.methodMix).map(([label, value]) => ({ label, value }));
        return `
          <section class="page active" id="page-scope3">
            <div class="page-shell">
              ${pageHeading("Scope 3", `Scope 3 emissions, category concentration and calculation methods for ${selectedYear()}`)}
              <div class="page-grid scope3-grid">
                ${kpiCard("Scope 3 emissions", formatNumber(summary.total), "tCO2e", selectedYear(), { text: `${change <= 0 ? "↓" : "↑"} ${oneDecimal.format(Math.abs(change))}% vs baseline`, bad: change > 0 })}
                ${kpiCard("Largest category", categories[0] ? formatNumber(categories[0].value) : "0", "tCO2e", categories[0]?.label || "No data", { text: `${oneDecimal.format(summary.total && categories[0] ? categories[0].value / summary.total * 100 : 0)}% of Scope 3` }, "neutral")}
                ${kpiCard("Top two concentration", `${oneDecimal.format(summary.total ? topTwo / summary.total * 100 : 0)}%`, "", "Priority categories", { text: "Engagement focus" }, "warning")}
                ${kpiCard("Physical activity data", `${oneDecimal.format(quality.physicalShare)}%`, "", "Emissions weighted", { text: "Nonfinancial units" })}
                ${panel("Scope 3 category profile", "Highest-emitting categories in the selected view", barChart(categories.slice(0, 7), { horizontal: true, ariaLabel: "Scope 3 emissions by category" }), "wide-panel")}
                ${panel("Calculation method mix", "Detailed emissions-weighted distribution", methodMixChart(methods), "narrow-panel")}
                ${panel("Priority improvements", "", `<div class="note-list"><div class="note-item"><strong>Purchased goods:</strong> request supplier-specific quantities and product carbon data.</div><div class="note-item"><strong>Capital goods:</strong> establish project-level asset and embodied-carbon records.</div><div class="note-item"><strong>Downstream transport:</strong> obtain route, mass and distance data from providers.</div></div>`, "wide-panel note-panel")}
                ${panel("Interpretation", "", `<p class="insight-copy">Spend-based estimates remain useful for screening, but the improvement priority is to move material categories toward physical activity data and supplier-specific information where decisions and engagement can change outcomes.</p>`, "narrow-panel insight-panel")}
              </div>
            </div>
          </section>`;
      }

      function renderDataQuality(records) {
        const quality = core.getQualityMetrics(records);
        const methods = Object.entries(quality.methodMix).map(([label, value]) => ({ label, value }));
        const coverageFor = (scope) => core.getQualityMetrics(records.filter((record) => record.scope === scope)).inventoryCoverage;
        return `
          <section class="page active" id="page-quality">
            <div class="page-shell">
              ${pageHeading("Data Quality & Methodology", `Coverage, data specificity and calculation methods for ${selectedYear()}`)}
              <div class="page-grid quality-grid">
                ${kpiCard("Inventory coverage", `${oneDecimal.format(quality.inventoryCoverage)}%`, "", "Required source-period data", { text: `${oneDecimal.format(Math.max(0, 100 - quality.inventoryCoverage))} pts gap` }, quality.inventoryCoverage < 95 ? "warning" : "")}
                ${kpiCard("Supplier-specific share", quality.supplierSpecificShare === null ? "N/A" : `${oneDecimal.format(quality.supplierSpecificShare)}%`, "", "Scope 3 emissions weighted", { text: quality.supplierSpecificShare === null ? "No Scope 3 in view" : "Value-chain specific" })}
                ${kpiCard("Physical activity data", `${oneDecimal.format(quality.physicalShare)}%`, "", "Emissions weighted", { text: "Nonfinancial units" })}
                ${kpiCard("Spend-based reliance", `${oneDecimal.format(quality.spendShare)}%`, "", "Emissions weighted", { text: "Improvement focus", bad: quality.spendShare > 50 }, "neutral")}
                ${panel("Calculation method mix", "Emissions-weighted distribution of detailed methods", methodMixChart(methods), "chart-panel")}
                ${panel("Data coverage by scope", "Required source-period data captured", `<div class="progress-list"><div class="progress-row"><span>Scope 1</span><div class="progress-track"><div class="progress-fill" style="width:${coverageFor("Scope 1")}%"></div></div><span class="progress-value">${oneDecimal.format(coverageFor("Scope 1"))}%</span></div><div class="progress-row"><span>Scope 2</span><div class="progress-track"><div class="progress-fill" style="width:${coverageFor("Scope 2")}%"></div></div><span class="progress-value">${oneDecimal.format(coverageFor("Scope 2"))}%</span></div><div class="progress-row"><span>Scope 3</span><div class="progress-track"><div class="progress-fill" style="width:${coverageFor("Scope 3")}%"></div></div><span class="progress-value">${oneDecimal.format(coverageFor("Scope 3"))}%</span></div></div>`, "chart-panel")}
                ${panel("Priority data improvements", "", `<div class="priority-scroll" tabindex="0" aria-label="Scrollable priority data improvements"><table class="quality-table"><thead><tr><th>Priority source</th><th>Current approach</th><th>Main data gap</th><th>Recommended action</th><th>Priority</th></tr></thead><tbody><tr><td>Purchased goods</td><td>Financial | Spend-based</td><td>Product quantities and supplier carbon data unavailable</td><td>Collect quantities for material purchases and request supplier carbon data</td><td><span class="status high">High</span></td></tr><tr><td>Downstream transport</td><td>Financial | Spend-based</td><td>No mass, distance, route or fuel information</td><td>Collect tonne-km, route and fuel information</td><td><span class="status high">High</span></td></tr><tr><td>Employee commuting</td><td>Mixed | Distance-based</td><td>Incomplete survey and work-pattern information</td><td>Improve participation and collect office and remote-working days</td><td><span class="status medium">Medium</span></td></tr><tr><td>Business travel</td><td>Physical | Distance-based</td><td>Incomplete route and travel-class data</td><td>Obtain booking-level distance and travel-class information</td><td><span class="status medium">Medium</span></td></tr></tbody></table></div>`, "full-panel")}
              </div>
            </div>
          </section>`;
      }

      function renderNetZero(records) {
        const fy2025Total = core.getSummary(corporateComparableRecords("FY2025")).total;
        const fy2026Total = core.getSummary(corporateComparableRecords("FY2026")).total;
        const view = core.getNetZeroView(state.filters.fy, fy2025Total, fy2026Total);
        const currentPeriod = state.filters.fy === "FY2025" ? "FY2025 baseline" : "FY2026 actual";
        const achievedReduction = Math.max(0, view.reductionAchieved);
        return `
          <section class="page active" id="page-netzero">
            <div class="page-shell">
              ${pageHeading("Net Zero Pathway", "Current performance, approved milestones and the pathway to net zero by FY2050")}
              <div class="page-grid netzero-grid">
                ${kpiCard("Current emissions", formatNumber(view.current), "tCO2e", currentPeriod, { text: "Reported performance" }, "neutral")}
                ${kpiCard("Reduction from baseline", `${oneDecimal.format(Math.max(0, view.reductionPercent))}%`, "", `${formatNumber(achievedReduction)} tCO2e below FY2025`, { text: "Reduction achieved" })}
                ${kpiCard("FY2030 target", formatNumber(view.target2030), "tCO2e", "35% below baseline", { text: "Next milestone" })}
                ${kpiCard("Gap to FY2030", formatNumber(view.gapTo2030), "tCO2e", "Remaining reduction", { text: view.gapTo2030 === 0 ? "Target reached" : "Action required", bad: view.gapTo2030 > 0 }, "warning")}
                ${panel("Corporate emissions pathway", "Reported actuals and approved target milestones", netZeroPathwayChart(view), "wide-panel", "Net zero by FY2050")}
                ${panel("Progress to FY2030", "Share of the required reduction already achieved", `<div class="milestone-progress"><div class="milestone-value"><strong>${oneDecimal.format(view.progressTo2030)}%</strong><span>of required reduction achieved</span></div><div class="milestone-track"><span style="width:${view.progressTo2030}%"></span></div><div class="milestone-stats"><div class="milestone-stat"><strong>${formatNumber(achievedReduction)}</strong><span>tCO2e achieved</span></div><div class="milestone-stat"><strong>${formatNumber(view.gapTo2030)}</strong><span>tCO2e remaining</span></div><div class="milestone-stat"><strong>${formatNumber(view.totalReductionRequired)}</strong><span>tCO2e total required</span></div></div><p class="milestone-note">Progress equals ${formatNumber(achievedReduction)} tCO2e achieved divided by the ${formatNumber(view.totalReductionRequired)} tCO2e reduction required for FY2030.</p></div>`, "narrow-panel")}
                ${panel("Priority decarbonization actions", "", `<div class="lever-list"><article class="lever"><span class="lever-number">01</span><h4>100% fleet electrification</h4><p><strong>Scope 1.</strong> Replace combustion vehicles through planned asset cycles and verified charging data.</p></article><article class="lever"><span class="lever-number">02</span><h4>RE100</h4><p><strong>Scope 2.</strong> Use 100% renewable electricity with credible contractual evidence.</p></article><article class="lever"><span class="lever-number">03</span><h4>Supplier decarbonization</h4><p><strong>Scope 3.</strong> Prioritize suppliers with credible emissions reduction commitments.</p></article><article class="lever"><span class="lever-number">04</span><h4>Carbon capture, utilization and storage (CCUS)</h4><p><strong>Final 10%.</strong> Neutralize residual emissions through verified capture and permanent storage.</p></article></div>`, "full-panel")}
              </div>
            </div>
          </section>`;
      }

      function renderApp() {
        const records = state.page === "netzero" ? corporateCurrentRecords() : currentRecords();
        if (!records.length) {
          content.innerHTML = `<section class="page active"><div class="page-shell">${pageHeading(pageNames[state.page], "The selected filters do not return any illustrative records")}<div>${emptyState()}</div></div></section>`;
        } else {
          const renderers = {
            overview: renderOverview,
            scope1: renderScope1,
            scope2: renderScope2,
            scope3: renderScope3,
            quality: renderDataQuality,
            netzero: renderNetZero
          };
          content.innerHTML = renderers[state.page](records);
        }
        document.querySelectorAll(".nav-button").forEach((button) => {
          const active = button.dataset.page === state.page;
          button.classList.toggle("active", active);
          button.setAttribute("aria-current", active ? "page" : "false");
        });
        const index = pages.indexOf(state.page);
        document.getElementById("pageCounter").textContent = `${index + 1} of ${pages.length}`;
        document.getElementById("previousPage").disabled = index === 0;
        document.getElementById("nextPage").disabled = index === pages.length - 1;
        syncFilterAvailability();
        document.title = `${pageNames[state.page]} | Company X by RCC`;
      }

      function navigateTo(page, pushHistory = true) {
        if (!pages.includes(page)) return;
        state.page = page;
        if (pushHistory) history.pushState({ page }, "", `#${page}`);
        renderApp();
      }

      function movePage(direction) {
        const index = pages.indexOf(state.page);
        const nextIndex = Math.max(0, Math.min(pages.length - 1, index + direction));
        if (nextIndex !== index) navigateTo(pages[nextIndex]);
      }

      function optionsFor(field) {
        return [...new Set(core.DATA.map((record) => record[field]))].sort();
      }

      function populateFilters() {
        const fields = {
          fy: ["FY2026", "FY2025"],
          entity: optionsFor("entity"),
          facility: optionsFor("facility"),
          method: optionsFor("method")
        };
        document.querySelectorAll("[data-filter]").forEach((select) => {
          const field = select.dataset.filter;
          const values = fields[field];
          const allLabel = field === "fy" ? "All years" : "All";
          select.innerHTML = `<option value="All">${allLabel}</option>${values.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("")}`;
          select.value = state.filters[field];
          select.addEventListener("change", () => {
            state.filters[field] = select.value;
            renderApp();
          });
        });
      }

      function resetFilters() {
        state.filters = { fy: "FY2026", entity: "All", facility: "All", method: "All" };
        document.querySelectorAll("[data-filter]").forEach((select) => {
          select.value = state.filters[select.dataset.filter];
        });
        renderApp();
      }

      function showTooltip(target, event) {
        const text = target.dataset.tip;
        if (!text) return;
        tooltip.textContent = text;
        tooltip.classList.add("visible");
        const rect = tooltip.getBoundingClientRect();
        const x = event?.clientX ?? target.getBoundingClientRect().left;
        const y = event?.clientY ?? target.getBoundingClientRect().top;
        tooltip.style.left = `${Math.min(window.innerWidth - rect.width - 12, x + 12)}px`;
        tooltip.style.top = `${Math.max(10, y - rect.height - 12)}px`;
      }

      function hideTooltip() {
        tooltip.classList.remove("visible");
      }

      function togglePresentation() {
        state.presentation = !state.presentation;
        dashboard.classList.toggle("presentation", state.presentation);
        document.getElementById("presentationButton").setAttribute("aria-pressed", String(state.presentation));
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch {
          document.getElementById("fullscreenButton").title = "Fullscreen is unavailable in this browser";
        }
      }

      function downloadDashboard() {
        const source = `<!doctype html>\n${document.documentElement.outerHTML}`;
        const blob = new Blob([source], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "company-x-ghg-dashboard.html";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      document.querySelector(".page-nav").addEventListener("click", (event) => {
        const button = event.target.closest("[data-page]");
        if (button) navigateTo(button.dataset.page);
      });
      document.getElementById("previousPage").addEventListener("click", () => movePage(-1));
      document.getElementById("nextPage").addEventListener("click", () => movePage(1));
      document.getElementById("resetFilters").addEventListener("click", resetFilters);
      document.getElementById("presentationButton").addEventListener("click", togglePresentation);
      document.getElementById("fullscreenButton").addEventListener("click", toggleFullscreen);
      document.getElementById("downloadButton").addEventListener("click", downloadDashboard);

      document.addEventListener("keydown", (event) => {
        if (core.shouldIgnoreArrow(event.target.tagName)) return;
        if (event.key === "ArrowRight") movePage(1);
        if (event.key === "ArrowLeft") movePage(-1);
      });

      document.addEventListener("pointerover", (event) => {
        const target = event.target.closest("[data-tip]");
        if (target) showTooltip(target, event);
      });
      document.addEventListener("pointerout", (event) => {
        if (event.target.closest("[data-tip]")) hideTooltip();
      });
      document.addEventListener("focusin", (event) => {
        const target = event.target.closest("[data-tip]");
        if (target) showTooltip(target);
      });
      document.addEventListener("focusout", (event) => {
        if (event.target.closest("[data-tip]")) hideTooltip();
      });

      window.addEventListener("resize", scaleDashboard);
      window.addEventListener("hashchange", () => navigateTo(location.hash.slice(1), false));
      window.addEventListener("popstate", () => navigateTo(location.hash.slice(1) || "overview", false));

      populateFilters();
      scaleDashboard();
      renderApp();
      if (!location.hash) history.replaceState({ page: state.page }, "", `#${state.page}`);

      globalThis.CompanyXDashboardApp = { state, navigateTo, resetFilters, renderApp, togglePresentation, toggleFullscreen };
    })();
  </script>
</body>
</html>
